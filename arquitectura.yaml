# arquitectura.yaml — el modelo de LA CÉLULA Cockpit (P1) como dato (arquitectura-como-dato · I-73 replicado — CK-07)
#
# QUÉ ES: el mismo patrón de tooling/strategy/arquitectura.yaml (I-73), a nivel célula. Modela
# el estado ACTUAL — Stage 4 (CK-07) ejecutado: dos binarios independientes (`cockpit`/DevHub y
# `directorio`/Cockpit), el andamiaje transicional (Deps/route-group-adapter/alias-npm/symlink)
# desmontado. El contrato de datos DevHub→Cockpit (destino) queda diseñado (CK-08) sin código —
# nada lo consume todavía. Curado a eventos de decisión: cada elemento lleva `fichas:` (CK-NN de
# esta célula, o I-NN/DH-NN cuando cruza célula). NO se cosecha — su SSoT son las fichas del ledger.
#
# QUIÉN LO CONSUME: tooling/scripts/gen_arquitectura_cockpit.py VALIDA (fichas resuelven en
# products/cockpit/LEDGER.md o tooling/strategy/LEDGER.md o products/devhub/LEDGER.md · joins ·
# enums del harness-descriptor) y emite products/docs/architecture/arquitectura-cockpit.data.js
# → el shell de products/harness-studio/shell/ lo renderiza (cero código nuevo — I-60 DIP).
#
# CÓMO SE MANTIENE: al firmar una ficha CK-NN que cambia esto, se edita ESTE archivo en el MISMO
# evento (misma disciplina que I-73). El gate (gen_all.py --check) bloquea fichas rotas y drift.

meta:
  id: cockpit-p1
  nombre: "Arquitectura de la célula — Cockpit (P1)"
  version: 0.1.0
  proposito: >-
    Cockpit (P1, "Discovery") y DevHub (P2, "Delivery") son aplicaciones independientes
    (Candidata A, I-74) — no un binario compartido. Stage 4 (CK-07) ejecutado: Cockpit tiene
    runtime propio (binario `directorio`, N13) — el andamiaje transicional (`Deps`, route-group
    adapter, alias npm, symlink) quedó desmontado, no solo diseñado. El contrato de datos
    DevHub→Cockpit (para cuando exista un consumidor real de capabilities/releases) queda
    diseñado (CK-08) pero sin código — nada lo consume todavía. Este modelo existe para que esa
    frontera nunca vuelva a leerse como "un solo sistema" — el error que corrigieron I-74/CK-07 v2.

# ---- PLANOS = las bandas del render ----
planos:
  - { id: actores,        nombre: "Roles",                     sub: "quién usa Cockpit — Directorio · Área · Consultor (CK-01)" }
  - { id: cockpit-app,    nombre: "Cockpit (P1) — propio",      sub: "código y runtime que esta célula posee, hoy y a futuro" }
  - { id: contrato,       nombre: "Contrato de datos (DESTINO)", sub: "cómo DevHub llega a Cockpit una vez separados — diseñado, sin código (CK-08)" }
  - { id: devhub-externo, nombre: "DevHub (P2) — externo",      sub: "fuente de datos de Cockpit; célula distinta, ledger distinto (DH-NN)" }

# ---- TIPOS ----
tipos:
  - { id: actor,           label: "Actor (rol humano)" }
  - { id: modulo,          label: "Módulo de código (Go/TS)" }
  - { id: vista,           label: "Vista / UI" }
  - { id: contrato,        label: "Contrato / frontera explícita" }
  - { id: servicio,        label: "Servicio / runtime" }
  - { id: backend,         label: "Backend no construido" }
  - { id: sistema-externo, label: "Sistema de otra célula" }

# ---- COMPONENTES ----
componentes:

  # — actores —
  - id: rol-directorio
    tipo: actor
    plano: actores
    nombre: "Directorio"
    estado: activo
    fichas: [CK-01]
    proposito: "El mapa vivo de la organización: objetivos, cumplimiento, drill-down. Consume la Vista Negocio."
  - id: rol-area
    tipo: actor
    plano: actores
    nombre: "Área"
    estado: declarado
    fichas: [CK-01, CK-06]
    proposito: "Su rebanada de procesos/sistemas. Placeholder 'próximamente' en CockpitShell (CK-06) — sin auth real todavía."
  - id: rol-consultor
    tipo: actor
    plano: actores
    nombre: "Consultor"
    estado: declarado
    fichas: [CK-01, CK-06]
    proposito: "En fase de implantación. Placeholder 'próximamente' en CockpitShell; a futuro opera el Motor de Discovery."

  # — cockpit-app (propio, P1) —
  - id: portfolio-model
    tipo: modulo
    plano: cockpit-app
    nombre: "Modelo de portfolio (Empresa→Sistema)"
    estado: activo
    ruta: products/cockpit/ui/lib/portfolio.ts
    fichas: [CK-02]
    proposito: "Funciones/tipos puros, SSoT de navegación — extraído Stage 1, cero runtime React/Next."
  - id: cockpit-go-module
    tipo: modulo
    plano: cockpit-app
    nombre: "Módulo Go `cockpit`"
    estado: activo
    ruta: products/cockpit/go
    fichas: [CK-05]
    proposito: "package cockpit — handlers HTTP de Directorio (Portfolio+Negocio), dueño del contrato de esos endpoints desde Stage 2."
  - id: portfolio-api
    tipo: contrato
    plano: cockpit-app
    nombre: "Contrato /api/portfolio"
    estado: activo
    ruta: products/cockpit/go/portfolio.go
    fichas: [CK-05]
    proposito: "Árbol Empresa→Sistema — RegistryProjects fresh de disco por request (contrato asimétrico documentado en CK-05)."
  - id: negocio-api
    tipo: contrato
    plano: cockpit-app
    nombre: "Contrato /api/negocio"
    estado: activo
    ruta: products/cockpit/go/negocio.go
    fichas: [CK-05]
    proposito: "Hilo de Oro + Brechas por empresa — resuelve contra snapshot de activos del arranque."
  - id: cockpit-shell
    tipo: vista
    plano: cockpit-app
    nombre: "CockpitShell"
    estado: activo
    ruta: products/cockpit/ui/components/shell/CockpitShell.tsx
    fichas: [CK-06]
    proposito: "Shell + nav por rol (Directorio vivo; Área/Consultor placeholder), cockpit-owned, consume COCKPIT_NAV."
  - id: negocio-view
    tipo: vista
    plano: cockpit-app
    nombre: "NegocioView"
    estado: activo
    ruta: products/cockpit/ui/components/negocio/NegocioView.tsx
    fichas: [CK-06]
    proposito: "Hilo de Oro navegable + Brechas — runtime inyectado por props (empresa/tree/setEmpresa), no llama useSistema() directo."
  - id: cockpit-runtime-propio
    tipo: servicio
    plano: cockpit-app
    nombre: "Runtime propio de Cockpit — binario `directorio`"
    estado: activo
    ruta: products/cockpit/go/cmd/directorio
    fichas: [CK-07]
    proposito: "cmd/launcher/puerto propios (4100) — el binario N13 (NODOS.md). Envuelve cockpit-go-module + cockpit-shell (ahora Next app independiente), sin pasar por el binario de DevHub ni importar su paquete."
  - id: motor-discovery
    tipo: backend
    plano: cockpit-app
    nombre: "Motor de Discovery (ingesta multi-fuente)"
    estado: pendiente
    fichas: [I-74]
    proposito: "La mitad de P1 aún no construida — As-Is/To-Be/gaps, razonamiento server-side (N1 en NODOS.md). Campaña propia, sin fecha; sigue siendo P1, no un tercer producto."

  # — contrato de datos (destino, a diseñar) —
  - id: contrato-datos
    tipo: contrato
    plano: contrato
    nombre: "Contrato de datos DevHub→Cockpit"
    estado: pendiente
    fichas: [CK-07, CK-08]
    proposito: "Diseñado (CK-08), sin código: Pull API — `directorio` llama GET /api/contrato/directorio?sistema=... a `cockpit` (devhub) en vivo. Envelope versionado ({contract_version,data}), auth mismo-host default + bearer token LAN (DIRECTORIO_FEED_TOKEN). Sin implementar: cero consumidor real hoy (Motor de Discovery, sin fecha)."
  - id: graduacion-repo
    tipo: contrato
    plano: contrato
    nombre: "Condición de graduación a repo propio"
    estado: activo
    fichas: [I-64, I-71]
    proposito: "Mitad-1 (frontera por carpetas) vigente — separar RUNTIME no implica separar REPO. Mitad-2 (cadencia comercial propia) derogada por I-71. Gobierna el alcance de Stage 4: dos binarios, un monorepo."

  # — DevHub (externo) —
  - id: devhub-delivery
    tipo: sistema-externo
    plano: devhub-externo
    nombre: "DevHub — Delivery (binario `cockpit`, N5)"
    estado: activo
    ruta: products/devhub/go
    fichas: [DH-01]
    proposito: "Tablero SDD, capabilities, releases — creciendo por ROL (CTO vs developer). Fuente de datos de Cockpit, célula y ledger propios (DH-NN)."

# ---- RELACIONES ----
relaciones:
  - { from: rol-directorio,        to: cockpit-shell,           tipo: usa }
  - { from: rol-area,              to: cockpit-shell,           tipo: usa }
  - { from: rol-consultor,         to: cockpit-shell,           tipo: usa }
  - { from: rol-consultor,         to: motor-discovery,         tipo: usa }        # futuro
  - { from: cockpit-shell,         to: negocio-view,            tipo: compone }
  - { from: cockpit-shell,         to: portfolio-model,         tipo: usa }
  - { from: negocio-view,          to: negocio-api,             tipo: usa }
  - { from: negocio-api,           to: cockpit-go-module,       tipo: compone }
  - { from: portfolio-api,         to: cockpit-go-module,       tipo: compone }
  - { from: cockpit-runtime-propio, to: cockpit-go-module,      tipo: adapta }     # Stage 4: launcher propio envuelve el mismo módulo
  - { from: cockpit-runtime-propio, to: motor-discovery,        tipo: compone }    # futuro: el runtime propio absorbe el motor cuando exista
  - { from: cockpit-runtime-propio, to: contrato-datos,         tipo: usa }        # destino
  - { from: contrato-datos,        to: devhub-delivery,         tipo: adapta }     # reemplaza deps-go/route-group-adapter/alias-npm/symlink
  - { from: graduacion-repo,       to: cockpit-runtime-propio,  tipo: gobierna }   # runtime≠repo — por qué Stage 4 no salta a repo propio
