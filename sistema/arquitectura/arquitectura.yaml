# arquitectura.yaml — el modelo de LA CÉLULA Cockpit (P1) como dato (arquitectura-como-dato · I-73 replicado — CK-07)
#
# QUÉ ES: el mismo patrón de tooling/strategy/arquitectura.yaml (I-73), a nivel célula. Modela
# el estado ACTUAL — Stage 4 (CK-07) ejecutado y evolucionado en CK-16: Cockpit = binario
# `directorio` (único binario del data plane); P2 = DevStudio (app de escritorio, reemplazó al
# server DevHub; GitHub como conector). La conexión de datos de delivery hacia Cockpit quedó SIN
# mecanismo (diseño CK-08 derogado en CK-16) — se diseña con el primer consumidor real (BL-18).
# Curado a eventos de decisión: cada elemento lleva `fichas:` (CK-NN de esta célula, o
# I-NN/DH-NN cuando cruza célula). NO se cosecha — su SSoT son las fichas del ledger.
#
# QUIÉN LO CONSUME: gen_arquitectura.py (CK-15, cierra BL-08) — lo valida (relaciones joinean,
# estados/tipos en vocabulario, rutas existen, fichas CK-10+ resuelven en LEDGER.md) y lo
# renderiza a arquitectura.html (vista visual de la célula). Rutas actualizadas al repo propio
# en CK-11 (antes apuntaban a products/cockpit/* del monorepo).
#
# CÓMO SE MANTIENE: al firmar una ficha CK-NN que cambia esto, se edita ESTE archivo en el MISMO
# evento (misma disciplina que I-73) y se corre gen_arquitectura.py (gate: --check).

meta:
  id: cockpit-p1
  nombre: "Arquitectura de la célula — Cockpit (P1)"
  version: 0.1.0
  proposito: >-
    Cockpit (P1, "Discovery") y P2 ("Delivery") son productos independientes (Candidata A,
    I-74) — cero import de código. Stage 4 (CK-07) ejecutado: Cockpit tiene runtime propio
    (binario `directorio`, N13). Evolución CK-16: P2 = DevStudio (app de escritorio por usuario,
    reemplazó al server DevHub; GitHub como conector de la orquestación) — el contrato de datos
    CK-08 quedó derogado y la conexión de delivery hacia Cockpit se diseña con el primer
    consumidor real (BL-18). Este modelo existe para que esa frontera nunca vuelva a leerse como
    "un solo sistema" — el error que corrigieron I-74/CK-07 v2.

# ---- PLANOS = las bandas del render ----
planos:
  - { id: actores,        nombre: "Roles",                     sub: "quién usa Cockpit — Directorio · Área · Consultor (CK-01)" }
  - { id: cockpit-app,    nombre: "Cockpit (P1) — propio",      sub: "código y runtime que esta célula posee, hoy y a futuro" }
  - { id: contrato,       nombre: "Conexión de datos (DESTINO)", sub: "cómo llegan los datos de delivery a Cockpit — sin mecanismo (CK-08 derogado en CK-16, TBD con BL-18)" }
  - { id: devhub-externo, nombre: "DevStudio (P2) — externo",    sub: "app de escritorio de desarrollo; futura fuente de datos de Cockpit vía GitHub; célula distinta, ledger DH-NN" }

# ---- TIPOS ----
tipos:
  - { id: actor,           label: "Actor (rol humano)" }
  - { id: modulo,          label: "Módulo de código (Go/TS)" }
  - { id: vista,           label: "Vista / UI" }
  - { id: contrato,        label: "Contrato / frontera explícita" }
  - { id: servicio,        label: "Servicio / runtime" }
  - { id: backend,         label: "Backend no construido" }
  - { id: sistema-externo, label: "Sistema de otra célula" }

# ---- COMPONENTES ----
componentes:

  # — actores —
  - id: rol-directorio
    tipo: actor
    plano: actores
    nombre: "Directorio"
    estado: activo
    fichas: [CK-01]
    proposito: "El mapa vivo de la organización: objetivos, cumplimiento, drill-down. Consume la Vista Negocio."
  - id: rol-area
    tipo: actor
    plano: actores
    nombre: "Área"
    estado: declarado
    fichas: [CK-01, CK-06]
    proposito: "Su rebanada de procesos/sistemas. Placeholder 'próximamente' en CockpitShell (CK-06) — sin auth real todavía."
  - id: rol-consultor
    tipo: actor
    plano: actores
    nombre: "Consultor"
    estado: declarado
    fichas: [CK-01, CK-06]
    proposito: "En fase de implantación. Placeholder 'próximamente' en CockpitShell; a futuro opera el Motor de Discovery."

  # — cockpit-app (propio, P1) —
  - id: portfolio-model
    tipo: modulo
    plano: cockpit-app
    nombre: "Modelo de portfolio (Empresa→Sistema)"
    estado: activo
    ruta: ui/lib/portfolio.ts
    fichas: [CK-02]
    proposito: "Funciones/tipos puros, SSoT de navegación — extraído Stage 1, cero runtime React/Next."
  - id: cockpit-go-module
    tipo: modulo
    plano: cockpit-app
    nombre: "Módulo Go `cockpit`"
    estado: activo
    ruta: go
    fichas: [CK-05]
    proposito: "package cockpit — handlers HTTP de Directorio (Portfolio+Negocio), dueño del contrato de esos endpoints desde Stage 2."
  - id: portfolio-api
    tipo: contrato
    plano: cockpit-app
    nombre: "Contrato /api/portfolio"
    estado: activo
    ruta: go/portfolio.go
    fichas: [CK-05]
    proposito: "Árbol Empresa→Sistema — RegistryProjects fresh de disco por request (contrato asimétrico documentado en CK-05)."
  - id: negocio-api
    tipo: contrato
    plano: cockpit-app
    nombre: "Contrato /api/negocio"
    estado: activo
    ruta: go/negocio.go
    fichas: [CK-05]
    proposito: "Hilo de Oro + Brechas por empresa — resuelve contra snapshot de activos del arranque."
  - id: objeto-api
    tipo: contrato
    plano: cockpit-app
    nombre: "Contrato /api/objeto"
    estado: activo
    ruta: go/objeto.go
    fichas: [CK-12, CK-13]
    proposito: "El objeto normalizado COMPLETO (9 entidades de objeto.schema, empresa/<tipo>/ del shell · D-15), validado entero al leer (refs del Hilo cruzan entidades, RACI A==1, enums, ciclos). Nació como /api/personas (CK-12), generalizado y superseded en CK-13."
  - id: cockpit-shell
    tipo: vista
    plano: cockpit-app
    nombre: "CockpitShell"
    estado: activo
    ruta: ui/components/shell/CockpitShell.tsx
    fichas: [CK-06]
    proposito: "Shell + nav por rol (Directorio vivo; Área/Consultor placeholder), cockpit-owned, consume COCKPIT_NAV."
  - id: negocio-view
    tipo: vista
    plano: cockpit-app
    nombre: "NegocioView"
    estado: activo
    ruta: ui/components/negocio/NegocioView.tsx
    fichas: [CK-06]
    proposito: "Hilo de Oro navegable + Brechas — runtime inyectado por props (empresa/tree/setEmpresa), no llama useSistema() directo."
  - id: cockpit-runtime-propio
    tipo: servicio
    plano: cockpit-app
    nombre: "Runtime propio de Cockpit — binario `directorio`"
    estado: activo
    ruta: go/cmd/directorio
    fichas: [CK-07]
    proposito: "cmd/launcher/puerto propios (4100) — el binario N13 (NODOS.md), único binario del data plane desde CK-16. Envuelve cockpit-go-module + cockpit-shell (Next app independiente), sin depender de ningún otro producto ni importar su código."
  - id: motor-discovery
    tipo: backend
    plano: cockpit-app
    nombre: "Motor de Discovery (ingesta multi-fuente)"
    estado: pendiente
    fichas: [I-74]
    proposito: "La mitad de P1 aún no construida — As-Is/To-Be/gaps, razonamiento server-side (N1 en NODOS.md). Campaña propia, sin fecha; sigue siendo P1, no un tercer producto."
  - id: app-auditor
    tipo: servicio
    plano: cockpit-app
    nombre: "App del Auditor (Consultor)"
    estado: pendiente
    fichas: [CK-11, CK-14]
    proposito: "Aplicación instalable propia del consultor (patrón harness-studio/dev-studio) — opera el método (sistema/metodo/proceso) y publica su resultado al repo de la empresa cliente: 'deploy de procesos', como código a producción pero con procesos/roles/objetivos que Cockpit entiende y renderiza. Nodo N14 en NODOS.md (CK-14: límites arquitectónicos fijados, R16/R17). BL-15..BL-17."
  - id: prep-auditoria
    tipo: backend
    plano: cockpit-app
    nombre: "Preparación para auditoría (gap-check vs norma)"
    estado: pendiente
    fichas: [CK-10]
    proposito: "Capability futura declarada en VISION §ISO: compara el estado modelado del cliente contra cláusulas de la norma y reporta gaps. Se activa solo con demanda real; NUNCA emite certificados (límite I-05). BL-14."

  # — contrato de datos (destino, a diseñar) —
  - id: contrato-datos
    tipo: contrato
    plano: contrato
    nombre: "Conexión de datos de delivery (DevStudio/GitHub→Cockpit)"
    estado: pendiente
    fichas: [CK-07, CK-08, CK-16]
    proposito: "SIN mecanismo firmado. El diseño CK-08 (Pull API contra el server DevHub en vivo) quedó DEROGADO en CK-16 — el host contra el que se diseñó ya no existirá (P2 = DevStudio, app de escritorio; GitHub como conector). Se diseña con el primer consumidor real (BL-18), probablemente leyendo del repo GitHub del cliente."
  - id: graduacion-repo
    tipo: contrato
    plano: contrato
    nombre: "Condición de graduación a repo propio"
    estado: activo
    fichas: [I-64, I-71]
    proposito: "Mitad-1 (frontera por carpetas) vigente — separar RUNTIME no implica separar REPO. Mitad-2 (cadencia comercial propia) derogada por I-71. Gobierna el alcance de Stage 4: dos binarios, un monorepo."

  # — DevStudio (P2, externo) —
  - id: devhub-delivery
    tipo: sistema-externo
    plano: devhub-externo
    nombre: "DevStudio — app de escritorio de desarrollo (P2, N5)"
    estado: activo
    ruta: "~/Proyectos/dev-studio (repo propio, externo)"
    fichas: [DH-12, CK-16]
    proposito: "Reemplaza al server DevHub (re-fichado N5, CK-16): app de escritorio por usuario (CTO/dev/devops/PO) para construir con proceso/arquitectura/doc as-code; GitHub como conector (PM refina/prioriza → devs reciben sus historias). Futura fuente de datos de delivery de Cockpit (mecanismo TBD, BL-18). Célula y ledger propios (DH-NN)."

# ---- RELACIONES ----
relaciones:
  - { from: rol-directorio,        to: cockpit-shell,           tipo: usa }
  - { from: rol-area,              to: cockpit-shell,           tipo: usa }
  - { from: rol-consultor,         to: cockpit-shell,           tipo: usa }
  - { from: rol-consultor,         to: motor-discovery,         tipo: usa }        # futuro
  - { from: rol-consultor,         to: app-auditor,             tipo: usa }        # futuro — su aplicación propia (CK-11)
  - { from: app-auditor,           to: cockpit-runtime-propio,  tipo: alimenta }   # futuro — publica procesos al repo cliente que `directorio` lee
  - { from: prep-auditoria,        to: negocio-api,             tipo: usa }        # futuro — compara estado modelado vs cláusulas
  - { from: cockpit-shell,         to: negocio-view,            tipo: compone }
  - { from: cockpit-shell,         to: portfolio-model,         tipo: usa }
  - { from: negocio-view,          to: negocio-api,             tipo: usa }
  - { from: negocio-api,           to: cockpit-go-module,       tipo: compone }
  - { from: portfolio-api,         to: cockpit-go-module,       tipo: compone }
  - { from: cockpit-runtime-propio, to: cockpit-go-module,      tipo: adapta }     # Stage 4: launcher propio envuelve el mismo módulo
  - { from: cockpit-runtime-propio, to: motor-discovery,        tipo: compone }    # futuro: el runtime propio absorbe el motor cuando exista
  - { from: cockpit-runtime-propio, to: contrato-datos,         tipo: usa }        # destino
  - { from: contrato-datos,        to: devhub-delivery,         tipo: adapta }     # reemplaza deps-go/route-group-adapter/alias-npm/symlink
  - { from: graduacion-repo,       to: cockpit-runtime-propio,  tipo: gobierna }   # runtime≠repo — por qué Stage 4 no salta a repo propio
