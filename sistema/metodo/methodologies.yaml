    cuando_no: "NO se busca sello (es guía, no certificable — coherente con VISION §ISO); jamás nivel por persona nombrada; el nivel no se declara — se deriva de evidencia con provenance"

M48:
  nombre: "Benchmarking externo de procesos y funciones (APQC Open Standards · Hackett DWC)"
