  que: "técnica lean: visualiza flujo de valor y desperdicio; future-state map"
  aporte_unico: "el FUTURE-STATE del FLUJO + el desperdicio visible (toque vs espera) — vende el ahorro a nivel de flujo; el veredicto por actividad es del triage ECRS (M35)"
