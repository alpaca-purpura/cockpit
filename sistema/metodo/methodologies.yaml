  cuando_usar: "dimensionar brechas (¿cuánto peor que el peer?) y validar metas de KPI (¿el to-be es alcanzable?) — diagnóstico M1 y seguimiento M2"
  objeto_primario: O6
  objetos_secundarios: [O3, O2]
  principios: [P1, P3]
  combina_con:
