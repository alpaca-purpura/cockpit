    cuando_no: "el benchmark NO reemplaza el levantamiento: la línea base y el rango se LEVANTAN por cliente (doctrina nichos anti-alucinación); no fija la meta solo (la firma el ciclo M21/M41); jamás ranking de personas (CK-24)"

