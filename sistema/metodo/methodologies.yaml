  objetos_secundarios: [O6]
  principios: [P3, P1]
  combina_con:
    - { m: M10, como: "el blueprint dice dónde duele; VSM optimiza el proceso detrás" }
    - { m: M07, como: "comparten el flujo de valor" }
    - { m: M35, como: "VSM revela el flujo; ECRS ordena el veredicto por actividad" }
  donde: { modulos: [m1, m2], etapas: [e3], capa_contexto: true }
