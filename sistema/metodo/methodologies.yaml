    - { m: M21, como: "el appetite se ata a mover un KR" }
    - { m: M22, como: "al sellar, la apuesta declara el valor que persigue en dinero con supuesto visible (D-23)" }
    - { m: M52, como: "arbitraje (recíproca en M52): appetite = tiempo/alcance que se apuesta; apetito de riesgo = exposición que el directorio tolera — dos varas distintas de la misma apuesta" }
    - { m: M54, como: "la apuesta lleva su bolsa de ambición y entra al rollup de mezcla real (D-22/D-23)" }
  donde: { modulos: [m2, m3], etapas: [e0, e3], capa_contexto: false }
  modo: columna
  twin:
    rol_ancla: ancla
    proyecciones: []
    dimensiones: [estrategia]
    cuando_si: "la apuesta SELLADA del directorio como entidad del twin (D-23): ciclo por-sellar → sellada → cumplida | retirada — re-apostar RE-VERSIONA, jamás edita; con valor en dinero (M22), apetito {tiempo, tope}, riesgo contrastado contra el apetito por categoría (M52) y bolsa de ambición (M54); el sello es gate humano del accountable (m3.e0.p5)"
    cuando_no: "el betting del ENGAGEMENT (shaping del pitch, ciclos, cool-down — cómo apostamos NOSOTROS en m3) sigue fuera del twin; al twin entra solo la apuesta del CLIENTE sellada por su directorio"

