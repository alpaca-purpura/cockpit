  fuente: { autor: "APQC (Open Standards Benchmarking) · The Hackett Group (Digital World Class)", obra: "Métricas de costo/productividad/ciclo/calidad por proceso PCF + benchmark top-quartile de funciones (finanzas y soporte)", url: "https://www.apqc.org/resource-library/resource-collection/finance-organization-key-benchmarks" }
