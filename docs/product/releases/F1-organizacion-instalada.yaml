id: F1
nombre: "Organización instalada — Fábrica + Organización + Edge"
estado: en-curso
descripcion: >-
  El rediseño de fondo CK-18: el modelo deja de ser "BYOC con motor server-side" y pasa
  a tres planos. Fabricante (nuestro) — Arnesia (fábrica de arneses), Repositorio
  Maestro y Distribución + telemetría + licencias. Organización (cliente) — Repositorio
  Oficial confidencial git self-hosted (Forgejo) + Depósito de fuentes, Data Lakehouse
  que nutre a Cockpit, y Cockpit con auth/niveles de acceso (policy-as-data) + módulo de
  Gestión de Cambios ISO. Edge (apps sobre Claude Code local, BYO licencia) — Consultio
  (App del Consultor, clon de DevStudio) que construye el mapa completo y lo publica al
  Repo Oficial, y Colab Studio (app del trabajador). El método se entrega al cliente
  empaquetado en arneses; la protección pasa a licencia + contrato. Aún por construir.
