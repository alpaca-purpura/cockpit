<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Sandbox · 4 capas — gestos v2 (DESECHABLE)</title>
<style>
/* ============================================================
   SANDBOX DE GESTOS v2 — 4 capas de gestión (D·E·T·O) — GRAY-BOX
   DESECHABLE. v2 (comentarios del operador 2026-07-26):
   (1) cada capa = TABLERO heterogéneo propio, no grilla de una
       entidad: D=sala del directorio · E=mapa de valor+capacidades
       · T=compromisos por columnas de área · O=carriles por equipo.
   (2) descenso ACOTADO: el recorte es un CHIP visible en el crumb
       (⌖ viendo…✕); lo fuera del recorte NO se dibuja — áreas
       colapsadas con contador, expansión lateral. O jamás entero.
   Se mantiene v1: subir≠atrás + selector de padres · elevador con
   fracturas · hilo · fog of war · burbujeo · transición ritual.
   ============================================================ */
:root{
  --teal:#00b7aa; --teal-hi:#1fc6b8; --teal-700:#007f76;
  --bg:#000; --panel:#0c1110; --raised:#141a19; --raised2:#181f1e; --border:#1f2826;
  --tx:rgba(255,255,255,.92); --tx-mut:rgba(255,255,255,.55); --tx-faint:rgba(255,255,255,.32);
  --warn:#e0ad4e; --crit:#e2766b; --ok:#5cc99a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel);z-index:30}
#bar .ttl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--tx-faint);text-transform:uppercase}
button{background:var(--raised);border:1px solid var(--border);color:var(--tx);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
button:hover{border-color:var(--teal-700)}
button:disabled{opacity:.35;cursor:default}
button.on{border-color:var(--teal);color:var(--teal-hi)}
#crumb{font-family:var(--mono);font-size:11px;color:var(--tx-mut);margin-left:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
#crumb b{color:var(--tx)}
/* CHIP DE RECORTE — el filtro del descenso, explícito y descartable */
#scopechip{display:none;align-items:center;gap:6px;background:rgba(0,183,170,.08);border:1px solid var(--teal-700);
  border-radius:20px;padding:3px 10px;font-family:var(--mono);font-size:9.5px;color:var(--teal-hi);cursor:default}
#scopechip .x{cursor:pointer;opacity:.7;font-size:11px;padding:0 2px}
#scopechip .x:hover{opacity:1}
#lente{margin-left:auto}
select{background:var(--raised);border:1px solid var(--border);color:var(--tx);border-radius:8px;padding:7px 10px;font-size:12px}
#main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab}
#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#stage.descend #world{animation:desc .3s cubic-bezier(.22,.61,.36,1)}
#stage.ascend  #world{animation:asc  .3s cubic-bezier(.22,.61,.36,1)}
@keyframes desc{from{opacity:0;transform:var(--tgt) scale(1.18)}to{opacity:1;transform:var(--tgt) scale(1)}}
@keyframes asc {from{opacity:0;transform:var(--tgt) scale(.85)}to{opacity:1;transform:var(--tgt) scale(1)}}
/* ---------- nodos ---------- */
.nd{position:absolute;background:var(--raised);border:1px solid var(--border);border-radius:9px;
    display:flex;flex-direction:column;justify-content:center;gap:3px;padding:8px 10px;cursor:pointer;user-select:none}
.nd:hover{border-color:#33443f}
.nd .lb{font-size:12px;font-weight:600;line-height:1.15}
.nd .un{font-family:var(--mono);font-size:8.5px;color:var(--tx-faint);letter-spacing:.08em;text-transform:uppercase}
.nd .mt{font-family:var(--mono);font-size:9px;color:var(--tx-mut)}
.nd.sel{border-color:var(--teal);box-shadow:0 0 0 1.5px var(--teal-700),0 0 16px rgba(0,183,170,.3)}
.nd.kids{border-color:var(--teal-700);background:rgba(0,183,170,.06)}
.nd.dimh{opacity:.14}
.nd.ctx{opacity:.38}
.nd.sil{background:repeating-linear-gradient(45deg,#0d1211,#0d1211 6px,#101615 6px,#101615 12px);border-style:dashed;border-color:#22302d;cursor:not-allowed}
.nd.sil .lb,.nd.sil .un,.nd.sil .mt{visibility:hidden}
.nd.sil::after{content:'sin acceso';position:absolute;inset:auto 6px 4px auto;font-family:var(--mono);font-size:7.5px;color:var(--tx-faint)}
.nd.orf{border-color:rgba(226,118,107,.55)}
.nd.orf::before{content:'▲ sin objetivo arriba';position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--crit)}
.nd.childless::before{content:'▲ sin compromisos abajo';position:absolute;top:-15px;left:0;font-family:var(--mono);font-size:8px;color:var(--crit)}
.nd.childless{border-color:rgba(226,118,107,.55)}
.nd.fire{border-color:var(--crit);animation:fire 1.6s infinite}
@keyframes fire{0%,100%{box-shadow:0 0 0 0 rgba(226,118,107,0)}50%{box-shadow:0 0 10px 1px rgba(226,118,107,.45)}}
.bub{position:absolute;top:-8px;right:-8px;background:#2a1512;border:1px solid var(--crit);color:var(--crit);
     font-family:var(--mono);font-size:9px;border-radius:20px;padding:1px 7px}
/* dots de estado (gris → el semáforo real vive en el twin) */
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#2e3b38;margin-right:5px}
.dot.g{background:var(--ok)}.dot.a{background:var(--warn)}.dot.r{background:var(--crit)}
/* tableros: paneles y bandas */
.pane{position:absolute;border:1px dashed var(--border);border-radius:10px;padding:10px 12px}
.pane .pt{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--tx-faint);text-transform:uppercase;margin-bottom:8px}
.bandlab{position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--tx-faint);text-transform:uppercase}
.bandline{position:absolute;height:1px;background:#243330}
.caplab{position:absolute;font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--tx-faint);text-transform:uppercase}
.caplab b{color:var(--tx-mut)}
/* chevron mini (cadena en E — contexto del twin v13) */
.chev{position:absolute;width:118px;height:40px;background:var(--raised);border:1px solid var(--border);
  clip-path:polygon(0 0,88% 0,100% 50%,88% 100%,0 100%,7% 50%);display:flex;align-items:center;padding-left:16px;
  font-size:9.5px;color:var(--tx-mut)}
/* columnas de área (T) + carriles (O) */
.areacol{position:absolute;border:1px solid var(--border);border-radius:12px;background:rgba(20,26,25,.35)}
.areacol .ah{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tx-mut);text-transform:uppercase;padding:8px 12px;border-bottom:1px solid var(--border-soft,#161d1c)}
/* área COLAPSADA — lo fuera del recorte no se dibuja: solo su borde + contador */
.areafold{position:absolute;border:1px dashed #22302d;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--tx-faint)}
.areafold:hover{border-color:var(--teal-700);color:var(--tx-mut)}
.areafold .an{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase}
.areafold .ac{font-family:var(--mono);font-size:10px}
.areafold .ax{font-size:9px;color:var(--teal-700)}
.areafold.hasfire{border-color:rgba(226,118,107,.4)}
svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
path{fill:none}
/* elevador */
#elev{width:118px;border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;padding:10px 8px;gap:6px}
#elev .et{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--tx-faint);text-transform:uppercase;text-align:center;margin-bottom:2px}
.piso{flex:1;border:1px solid var(--border);border-radius:8px;position:relative;cursor:pointer;background:var(--raised);overflow:hidden}
.piso:hover{border-color:var(--teal-700)}
.piso.cur{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal-700)}
.piso .pl{position:absolute;top:3px;left:6px;font-family:var(--mono);font-size:8px;color:var(--tx-mut)}
.piso .dots{position:absolute;inset:14px 5px 4px}
.pd{position:absolute;width:4px;height:4px;border-radius:1.5px;background:#2e3b38}
.pd.hil{background:var(--teal);box-shadow:0 0 4px var(--teal)}
.pd.me{background:#fff;box-shadow:0 0 5px #fff;width:5px;height:5px}
.pd.frx{background:var(--crit);border-radius:50%}
.pd.fr2{background:var(--warn);border-radius:50%}
.pd.ff{background:var(--crit);animation:fire 1.6s infinite;border-radius:50%}
#elev .leg{font-family:var(--mono);font-size:7.5px;color:var(--tx-faint);line-height:1.6;padding-top:4px}
#elev .leg i{font-style:normal}
#padres{position:absolute;z-index:40;background:var(--panel);border:1px solid var(--teal-700);border-radius:10px;padding:12px;display:none;max-width:300px}
#padres .pt{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--tx-mut);text-transform:uppercase;margin-bottom:8px}
#padres button{display:block;width:100%;text-align:left;margin-bottom:6px;font-size:12px}
#hint{padding:7px 14px;border-top:1px solid var(--border);background:var(--panel);font-family:var(--mono);font-size:9.5px;color:var(--tx-faint);display:flex;gap:16px;white-space:nowrap;overflow:hidden}
#hint b{color:var(--tx-mut);font-weight:600}
#toast{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:8px 16px;font-size:11.5px;color:var(--tx-mut);opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:70%}
</style></head><body>

<div id="bar">
  <span class="ttl">Sandbox · gestos 4 capas · v2</span>
  <button id="back" disabled>‹ Atrás</button>
  <button id="up" title="¿A qué contribuye lo que miro? (semántico — no es historia)">▲ Subir</button>
  <button id="hilo" title="Cadena vertical del nodo seleccionado a través de las 4 capas">⛓ Hilo</button>
  <span id="crumb"></span>
  <span id="scopechip"><span>⌖ <span id="scopetxt"></span></span><span class="x" title="quitar el recorte — ver el piso completo (O: nunca entero, por área)">✕</span></span>
  <span id="lente">
    <label style="font-family:var(--mono);font-size:9px;color:var(--tx-faint)">VER COMO </label>
    <select id="who">
      <option value="">— todos (sin lente)</option>
      <option value="0">Director</option>
      <option value="1">Gerente comercial</option>
      <option value="2">Jefe de operación</option>
      <option value="3">Analista</option>
    </select>
  </span>
</div>

<div id="main">
  <div id="stage">
    <div id="world"><svg id="edges"></svg><div id="nodes"></div></div>
    <div id="padres"></div>
    <div id="toast"></div>
  </div>
  <div id="elev">
    <div class="et">Elevador</div>
    <div class="piso" data-c="D"><span class="pl">D · directorio</span><div class="dots"></div></div>
    <div class="piso" data-c="E"><span class="pl">E · estratégico</span><div class="dots"></div></div>
    <div class="piso" data-c="T"><span class="pl">T · táctico</span><div class="dots"></div></div>
    <div class="piso" data-c="O"><span class="pl">O · operativo</span><div class="dots"></div></div>
    <div class="leg"><i style="color:var(--crit)">●</i> fractura / fuego<br><i style="color:var(--teal)">●</i> hilo<br><i style="color:#fff">●</i> tú</div>
  </div>
</div>

<div id="hint">
  <span><b>dblclick</b> = descender acotado (el chip ⌖ es el recorte; ✕ lo quita)</span>
  <span><b>click</b> = seleccionar</span>
  <span><b>▲ Subir</b> = ¿a qué contribuyo?</span>
  <span><b>‹ Atrás</b> = historia</span>
  <span><b>área plegada ▸</b> = expandir lateral</span>
</div>

<script>
/* ============ grafo gris DETERMINISTA ============ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(42);
const CAPAS=['D','E','T','O'];
const CAPNM={D:'Directorio — la apuesta y el riesgo',E:'Estratégico — el objetivo y la capacidad',T:'Táctico — el compromiso entre áreas',O:'Operativo — el caso y la excepción'};
const AREAS=['Área Comercial','Área Finanzas','Área Operaciones','Área GH'];
const nodes=[]; const byId={};
function mk(capa,i,extra){const id=capa+(i+1);
  const n=Object.assign({id,capa,i,label:'',parents:[],owner:Math.floor(rnd()*3)+1,fire:false},extra);
  nodes.push(n);byId[id]=n;return n}
/* D: 5 apuestas con kr-estado + riesgo (tablero del directorio) */
const DLB=['Liderazgo en vivienda media','Caja sana en proyectos','Expansión provincia','Marca empleadora','Digitalizar la cobranza'];
const DKR=[['margen →18%','a'],['DSO 91→60d','r'],['2 proyectos nuevos','g'],['rotación −20%','a'],['cobro digital 60%','a']];
const DRG=['media','alta','alta','baja','media'];
for(let i=0;i<5;i++)mk('D',i,{label:DLB[i],kr:DKR[i][0],krst:DKR[i][1],riesgo:DRG[i]});
/* E: 10 capacidades con área + madurez (navegables) — el resto del tablero E es contexto */
const ELB=['Comercializar','Cobrar','Diseñar producto','Ejecutar obra','Postventa','Financiar','Abastecer','Atraer talento','Analítica','Cumplimiento'];
for(let i=0;i<10;i++)mk('E',i,{label:ELB[i],area:i%4,mad:['g','a','a','r','g','a','g','r','a','g'][i]});
/* T: 22 compromisos con área */
for(let i=0;i<22;i++)mk('T',i,{label:'Compromiso T'+(i+1),area:i%4});
/* O: 72 tareas — heredan área del padre */
for(let i=0;i<72;i++)mk('O',i,{label:'Tarea O'+(i+1)});
nodes.filter(n=>n.capa==='E').forEach((n,i)=>{n.parents=['D'+(i%5+1)];if(i===3)n.parents.push('D'+((i+2)%5+1))});
nodes.filter(n=>n.capa==='T').forEach((n,i)=>{
  if(i===20||i===21){n.orphan=true;return}
  n.parents=['E'+(i%10+1)];if(i%5===0)n.parents.push('E'+((i+4)%10+1));
  n.area=byId[n.parents[0]].area});
nodes.filter(n=>n.capa==='O').forEach((n,i)=>{n.parents=['T'+(i%20+1)];n.area=byId[n.parents[0]].area??0});
byId['E9'].childless=true;nodes.filter(n=>n.capa==='T'&&n.parents.includes('E9')).forEach(n=>n.parents=n.parents.filter(p=>p!=='E9'));
byId['O47'].fire=true;byId['D1'].owner=0;
const kidsOf=id=>nodes.filter(n=>n.parents.includes(id));
const ancestors=id=>{const o=new Set(),q=[id];while(q.length){byId[q.pop()].parents.forEach(p=>{if(!o.has(p)){o.add(p);q.push(p)}})}return o};
const descendants=id=>{const o=new Set(),q=[id];while(q.length){kidsOf(q.pop()).forEach(k=>{if(!o.has(k.id)){o.add(k.id);q.push(k.id)}})}return o};
const fireAnc=ancestors('O47');
const fireArea=byId[[...ancestors('O47')].find(a=>byId[a].capa==='T')]?.area;

/* ============ estado ============ */
/* scope = el RECORTE del descenso: {nodo:id}|{area:idx}|null — visible como chip, descartable */
const st={capa:'D',scope:null,sel:null,hilo:false,lente:'',hist:[]};
const view={x:0,y:0,z:1};
const stage=document.getElementById('stage'),world=document.getElementById('world'),
      $n=document.getElementById('nodes'),$e=document.getElementById('edges');
function applyV(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;
  world.style.setProperty('--tgt',`translate(${view.x}px,${view.y}px)`)}
function fitPts(pts,pad=160,W,H){const vw=stage.clientWidth,vh=stage.clientHeight;
  if(!pts||!pts.length){view.z=Math.min(vw/W,vh/H,1);view.x=(vw-W*view.z)/2;view.y=(vh-H*view.z)/2;return}
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);
  const x0=Math.min(...xs)-pad,x1=Math.max(...xs)+pad+160,y0=Math.min(...ys)-pad,y1=Math.max(...ys)+pad;
  const z=Math.max(.4,Math.min(vw/(x1-x0),vh/(y1-y0),1.05));
  view.z=z;view.x=(vw-(x0+x1)*z)/2;view.y=(vh-(y0+y1)*z)/2}
function visible(n){if(st.lente==='')return'full';const L=+st.lente;
  if(L===0)return(n.capa==='D'||n.capa==='E')?'full':(n.owner===0||fireAnc.has(n.id)||n.id==='O47')?'full':'sil';
  const mine=n.owner===L,anc=[...ancestors(n.id)].some(a=>byId[a].owner===L),desc=[...descendants(n.id)].some(d=>byId[d].owner===L);
  return(mine||anc||desc)?'full':'sil'}

/* ============ helpers de render ============ */
function el(t,c,h){const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n}
function place(n,x,y,w,h){n.style.left=x+'px';n.style.top=y+'px';if(w)n.style.width=w+'px';if(h)n.style.height=h+'px';$n.appendChild(n);return n}
let PTS=[];
function ndEl(n,w,h,extraHtml,hiloSet,inScope){
  const d=el('div','nd');d.style.width=w+'px';d.style.height=h+'px';
  d.innerHTML=extraHtml;
  const vis=visible(n);
  if(vis==='sil')d.classList.add('sil');
  if(inScope==='kids')d.classList.add('kids'); if(inScope==='ctx')d.classList.add('ctx');
  if(hiloSet&&!hiloSet.has(n.id))d.classList.add('dimh');
  if(n.orphan)d.classList.add('orf'); if(n.childless)d.classList.add('childless'); if(n.fire)d.classList.add('fire');
  if(st.sel===n.id)d.classList.add('sel');
  if(fireAnc.has(n.id)&&!n.fire){const b=el('span','bub','▲ 1');b.title='1 excepción ardiendo abajo — burbujea desde O47';d.appendChild(b)}
  if(vis!=='sil'){
    d.onclick=e=>{e.stopPropagation();st.sel=st.sel===n.id?null:n.id;render(false)};
    d.ondblclick=e=>{e.stopPropagation();descend(n)};
  } else d.onclick=e=>{e.stopPropagation();toast('Sin acceso — el terreno existe, el detalle no es tuyo.')};
  d.title=n.label+(n.parents.length?' — contribuye a: '+n.parents.join(', '):'');
  return d}
function scopeKids(){ if(!st.scope||!st.scope.nodo)return null; return new Set(kidsOf(st.scope.nodo).map(k=>k.id)) }
/* scopeAreaSet (áreas del recorte, para plegar el resto) definida junto a los gestos */

/* ============ TABLEROS por capa (v2 — heterogéneos) ============ */
function renderD(hiloSet){
  const W=1660,H=760;
  place(el('div','caplab',`capa <b>D</b> · ${CAPNM.D}`),36,30);
  /* pulso de KRs + apetito (contexto de sala) */
  const ap=place(el('div','pane'),120,86,760,64);
  ap.innerHTML=`<div class="pt">Apetito de riesgo (tira — dato simulado)</div>
   <span class="mt" style="font-family:var(--mono);font-size:10px;color:var(--tx-mut)">liquidez <b style="color:var(--warn)">media</b> · reputación <b style="color:var(--ok)">baja</b> · expansión <b style="color:var(--crit)">alta</b></span>`;
  /* v2.1: sin jerga ("pulso"/"en banda" no se explican solas) — la pregunta del directorio, literal,
     y el conteo DERIVADO del dato (antes era texto hardcodeado que contradecía los puntos) */
  const dd=nodes.filter(n=>n.capa==='D'), nG=dd.filter(n=>n.krst==='g').length,
        nA=dd.filter(n=>n.krst==='a').length, nR=dd.filter(n=>n.krst==='r').length;
  const pu=place(el('div','pane'),920,86,380,72);
  pu.title='Cada punto = una apuesta: ¿su número del trimestre se mueve hacia la meta?';
  pu.innerHTML=`<div class="pt">¿Avanzan las apuestas? (este trimestre)</div>
    <div>${dd.map(n=>`<span class="dot ${n.krst}" title="${n.label}: ${n.kr}"></span>`).join('')}
    <span class="mt">${nG} en meta · ${nA} cerca · ${nR} fuera</span></div>`;
  /* excepciones que SUBIERON (burbujeo agregado) */
  const ex=place(el('div','pane'),1340,86,220,150);
  ex.innerHTML=`<div class="pt">Subió del piso</div>
    <div class="mt" style="line-height:1.7"><span style="color:var(--crit)">▲</span> 1 excepción ardiendo (O47 · ${AREAS[fireArea??0]})<br><span style="color:var(--crit)">▲</span> 2 compromisos sin objetivo<br><span style="color:var(--warn)">▲</span> 1 objetivo sin compromisos</div>`;
  /* las 5 APUESTAS — tarjetas ricas (kr + riesgo + dueño) */
  place(el('div','bandlab','Las apuestas del trimestre — dblclick = ¿qué las sostiene?'),120,196);
  nodes.filter(n=>n.capa==='D').forEach((n,i)=>{
    const d=ndEl(n,272,150,`<span class="un">apuesta</span><span class="lb">${n.label}</span>
      <span class="mt"><span class="dot ${n.krst}"></span>KR: ${n.kr}</span>
      <span class="mt">riesgo <b style="color:${n.riesgo==='alta'?'var(--crit)':n.riesgo==='media'?'var(--warn)':'var(--ok)'}">${n.riesgo}</b> · dueño: gris</span>`,hiloSet,null);
    place(d,120+i*300,226); n._x=120+i*300+136;n._y=300; PTS.push({x:n._x,y:n._y});
  });
  /* proyectos del portafolio (contexto gris) */
  const po=place(el('div','pane'),120,430,1440,120);
  po.innerHTML=`<div class="pt">Portafolio en vuelo (contexto — en el twin real: proyectos de mejora con ROI)</div>
   <div style="display:flex;gap:14px">${['Recuperación Marina 2.4×','Cobranza digital 1.8×','Cierre exprés 3.1×'].map(p=>`<span class="mt" style="border:1px solid var(--border);border-radius:8px;padding:8px 14px">${p}</span>`).join('')}
   <span class="mt" style="opacity:.5;align-self:center">· tablero heterogéneo: la capa es una SALA, no una grilla</span></div>`;
  return{W,H}
}
function renderE(hiloSet){
  const W=1660,H=860; const ks=scopeKids();
  place(el('div','caplab',`capa <b>E</b> · ${CAPNM.E}`),36,30);
  /* banda 1: objetivos (contexto twin) */
  place(el('div','bandlab','Objetivos · KR — en el twin real: banda Estrategia v13'),120,96);
  place(el('div','bandline'),120,110,1240);['O1 margen','O2 caja','O3 calidad','O4 venta','O5 cobranza','O6 marca','O7 equipo'].forEach((o,i)=>{
    place(el('div','nd ctx',`<span class="mt">${o}</span>`),120+i*180,124,160,40)});
  /* banda 2: cadena de valor (contexto twin) */
  place(el('div','bandlab','Cadena de valor — en el twin real: los 9 misionales v13'),120,214);
  place(el('div','bandline'),120,228,1240);
  ['Marketing','Venta','Diseño','Ejecución','Valorización','Facturación','Cobranza','Postventa'].forEach((c,i)=>{
    place(el('div','chev',c),120+i*128,242)});
  /* banda 3: CAPACIDADES (navegables — heatmap) */
  place(el('div','bandlab','Capacidades — heatmap de madurez · dblclick = ¿qué compromisos la construyen?'),120,330);
  place(el('div','bandline'),120,344,1240);
  nodes.filter(n=>n.capa==='E').forEach((n,i)=>{
    const inS=ks?(ks.has(n.id)?'kids':'ctx'):null;
    const d=ndEl(n,224,86,`<span class="un">capacidad · ${AREAS[n.area].replace('Área ','')}</span><span class="lb">${n.label}</span>
      <span class="mt"><span class="dot ${n.mad}"></span>madurez ${({g:'4',a:'3',r:'1'})[n.mad]} / deseada 4</span>`,hiloSet,inS);
    const x=120+(i%5)*252,y=358+Math.floor(i/5)*118;
    place(d,x,y); n._x=x+112;n._y=y+43; if(!ks||ks.has(n.id))PTS.push({x:n._x,y:n._y});
  });
  /* nota de tablero */
  place(el('div','pane',`<div class="pt">v2 — la capa E ES el mapa de valor del twin (v13) + capacidades; aquí gris, allá vivo</div>`),120,640,760,50);
  return{W,H}
}
function renderT(hiloSet){
  const ks=scopeKids(); const areasIn=scopeAreaSet();
  const colW=330,colGap=24; let x=120; const W=120+4*(colW+colGap)+140,H=860;
  place(el('div','caplab',`capa <b>T</b> · ${CAPNM.T}`),36,30);
  place(el('div','bandlab','KRs a los que anclan (contexto)'),120,88);
  ['margen →18%','DSO 91→60d','NPS 42→31','rotación −20%'].forEach((k,i)=>place(el('div','nd ctx',`<span class="mt">${k}</span>`),120+i*220,102,200,36));
  AREAS.forEach((a,ai)=>{
    const inScope=!areasIn||areasIn.has(ai);
    const members=nodes.filter(n=>n.capa==='T'&&n.area===ai);
    if(!inScope){ /* área PLEGADA: lo fuera del recorte NO se dibuja */
      const f=el('div','areafold'+(ai===fireArea?' hasfire':''));
      f.innerHTML=`<span class="an">${a}</span><span class="ac">${members.length} compromisos${ai===fireArea?' · <span style="color:var(--crit)">▲</span>':''}</span><span class="ax">expandir ▸</span>`;
      f.onclick=e=>{e.stopPropagation();expandArea(ai)};
      place(f,x,170,colW,120); x+=colW+colGap; return }
    const col=el('div','areacol');col.innerHTML=`<div class="ah">${a}</div>`;
    const rows=Math.ceil(members.length/2);
    place(col,x,170,colW,54+rows*84);
    members.forEach((n,mi)=>{
      const inS=ks?(ks.has(n.id)?'kids':'ctx'):null;
      const d=ndEl(n,146,66,`<span class="un">compromiso</span><span class="lb" style="font-size:10.5px">${n.label}</span><span class="mt">fecha · recurso gris</span>`,hiloSet,inS);
      const nx=x+10+(mi%2)*158, ny=224+Math.floor(mi/2)*84;
      place(d,nx,ny); n._x=nx+73;n._y=ny+33; if(!ks||ks.has(n.id))PTS.push({x:n._x,y:n._y});
    });
    x+=colW+colGap;
  });
  /* huérfanos (fractura) fuera de columna */
  const orph=nodes.filter(n=>n.capa==='T'&&n.orphan);
  if(!areasIn){ place(el('div','bandlab','Sin ancla — la fractura vive fuera de toda columna'),120,760);
    orph.forEach((n,i)=>{const d=ndEl(n,146,60,`<span class="un">compromiso</span><span class="lb" style="font-size:10.5px">${n.label}</span>`,hiloSet,null);
      place(d,120+i*170,780); n._x=120+i*170+73;n._y=810;}) }
  return{W,H:areasIn?620:H}
}
function renderO(hiloSet){
  /* O JAMÁS entero: solo el/las áreas del recorte; el resto = plegado con contador */
  const ks=scopeKids(); let areasIn=scopeAreaSet();
  if(!areasIn){ areasIn=new Set([0]); toast('El piso operativo nunca se dibuja entero — entraste por '+AREAS[0]+'; expande otras áreas si las necesitas.'); }
  const W=1660,H=820; let x=120;
  place(el('div','caplab',`capa <b>O</b> · ${CAPNM.O}`),36,30);
  AREAS.forEach((a,ai)=>{
    const members=nodes.filter(n=>n.capa==='O'&&n.area===ai);
    if(!areasIn.has(ai)){
      const f=el('div','areafold'+(ai===fireArea?' hasfire':''));
      f.innerHTML=`<span class="an">${a}</span><span class="ac">${members.length} tareas en cola${ai===fireArea?' · <span style="color:var(--crit)">▲ arde</span>':''}</span><span class="ax">expandir ▸</span>`;
      f.onclick=e=>{e.stopPropagation();expandArea(ai)};
      place(f,x,120,240,90); x+=264; return }
    /* área expandida: carriles de equipo */
    const col=el('div','areacol');col.innerHTML=`<div class="ah">${a} — colas por equipo (unidad: caso/tarea · horizonte: hoy)</div>`;
    const rows=Math.ceil(members.length/6);
    place(col,x,120,6*128+30,60+rows*58);
    members.forEach((n,mi)=>{
      const inS=ks?(ks.has(n.id)?'kids':'ctx'):null;
      const d=ndEl(n,116,44,`<span class="lb" style="font-size:9.5px;font-weight:500">${n.label}</span>`,hiloSet,inS);
      const nx=x+12+(mi%6)*128, ny=172+Math.floor(mi/6)*58;
      place(d,nx,ny); n._x=nx+58;n._y=ny+22; if((!ks||ks.has(n.id)))PTS.push({x:n._x,y:n._y});
    });
    x+=6*128+60;
  });
  place(el('div','pane',`<div class="pt">debajo de este piso no hay más twin — hay trabajo (arnés)</div>`),120,700,560,46);
  return{W:Math.max(W,x+120),H}
}

/* ============ render maestro ============ */
function render(anim){
  $n.innerHTML='';$e.innerHTML='';PTS=[];
  const hiloSet=st.hilo&&st.sel?new Set([st.sel,...ancestors(st.sel),...descendants(st.sel)]):null;
  const dim={D:renderD,E:renderE,T:renderT,O:renderO}[st.capa](hiloSet);
  world.style.width=dim.W+'px';world.style.height=dim.H+'px';
  crumb(); chip(); elevador(hiloSet); btns();
  if(anim){stage.classList.remove('descend','ascend');void stage.offsetWidth;stage.classList.add(anim)}
  fitPts(PTS.length&&(st.scope)?PTS:null,160,dim.W,dim.H); applyV();
}
function crumb(){const path=[];let f=st.scope&&st.scope.nodo;while(f){path.unshift(byId[f].label);f=byId[f].parents[0]||null;if(path.length>3)break}
  document.getElementById('crumb').innerHTML=(path.length?path.join(' <span style="opacity:.4">›</span> ')+' <span style="opacity:.4">›</span> ':'')+`<b>capa ${st.capa}</b>`}
function chip(){const c=document.getElementById('scopechip');
  if(st.scope&&st.scope.nodo){c.style.display='inline-flex';document.getElementById('scopetxt').textContent='viendo: lo que sostiene '+byId[st.scope.nodo].label}
  else if(st.scope&&st.scope.area!=null){c.style.display='inline-flex';document.getElementById('scopetxt').textContent='viendo: '+AREAS[st.scope.area]}
  else c.style.display='none'}
document.querySelector('#scopechip .x').onclick=e=>{e.stopPropagation();
  if(st.capa==='O'){st.scope={area:(st.scope&&st.scope.area)??(scopeAreaSet()?[...scopeAreaSet()][0]:0)};toast('El piso O nunca se muestra entero — el recorte baja a "por área".');}
  else st.scope=null;
  render(false)};
function btns(){document.getElementById('back').disabled=!st.hist.length;
  document.getElementById('up').disabled=st.capa==='D'&&!st.sel;
  document.getElementById('hilo').classList.toggle('on',st.hilo)}
function elevador(hiloSet){document.querySelectorAll('.piso').forEach(p=>{
  const c=p.dataset.c;p.classList.toggle('cur',c===st.capa);
  const box=p.querySelector('.dots');box.innerHTML='';
  const w=box.clientWidth||96,h=box.clientHeight||70;const NN={D:5,E:10,T:22,O:72}[c];
  nodes.filter(n=>n.capa===c).forEach(n=>{
    const d=el('span','pd');
    const cols={D:5,E:5,T:6,O:12}[c];
    d.style.left=((n.i%cols)/cols*w+3)+'px';d.style.top=(Math.floor(n.i/cols)/Math.ceil(NN/cols)*(h-8)+2)+'px';
    if(n.orphan||n.childless)d.classList.add(n.orphan?'frx':'fr2');
    if(n.fire)d.classList.add('ff');
    if(hiloSet&&hiloSet.has(n.id))d.classList.add('hil');
    if(st.sel===n.id||(st.scope&&st.scope.nodo===n.id&&c!==st.capa))d.classList.add('me');
    box.appendChild(d)});
  p.onclick=()=>viajar(c)})}

/* ============ gestos ============ */
function push(){st.hist.push({capa:st.capa,scope:st.scope&&{...st.scope},sel:st.sel})}
function descend(n){
  const ci=CAPAS.indexOf(n.capa);if(ci>=3){toast('Piso operativo — debajo no hay más twin: hay trabajo.');return}
  const ks=kidsOf(n.id);
  if(!ks.length){toast(`${n.label} no tiene nada debajo — FRACTURA: ${n.capa==='E'?'objetivo sin compromisos':'sin evidencia un nivel abajo'}.`);return}
  push();st.capa=CAPAS[ci+1];st.scope={nodo:n.id};st.sel=null;
  render('descend')}
function expandArea(ai){push();
  /* expandir lateral: el recorte nodo→área(s); suma, no reemplaza */
  const s=scopeAreaSet()||new Set();s.add(ai);
  st.scope={area:ai,extra:s};render(false);toast('Expandiste '+AREAS[ai]+' — el recorte ahora es por área (chip).')}
function ascend(){
  const base=st.sel?byId[st.sel]:st.scope&&st.scope.nodo?byId[st.scope.nodo]:null;
  if(!base){toast('Selecciona un nodo — subir pregunta "¿a qué contribuye ESTO?"');return}
  const cands=[...new Set(base.parents)];
  if(!cands.length){toast(`${base.label} no contribuye a nada — FRACTURA: operación sin objetivo.`);return}
  if(cands.length===1)return subirA(cands[0]);
  const pop=document.getElementById('padres');
  pop.innerHTML=`<div class="pt">${base.label} contribuye a ${cands.length} — ¿por cuál subes?</div>`+
    cands.map(p=>`<button data-p="${p}">${byId[p].label} <span style="opacity:.5;font-family:var(--mono);font-size:9px">capa ${byId[p].capa}</span></button>`).join('');
  pop.style.display='block';pop.style.left='50%';pop.style.top='90px';pop.style.transform='translateX(-50%)';
  pop.querySelectorAll('button').forEach(b=>b.onclick=e=>{e.stopPropagation();pop.style.display='none';subirA(b.dataset.p)})}
function subirA(pid){push();const p=byId[pid];
  st.capa=p.capa;st.scope=p.parents[0]?{nodo:p.parents[0]}:null;st.sel=pid;
  render('ascend')}
/* scopeAreaSet v2: soporta {area,extra} */
function scopeAreaSet(){const ks=scopeKids();
  if(ks)return new Set([...ks].map(id=>byId[id].area).filter(a=>a!=null));
  if(st.scope&&st.scope.extra)return st.scope.extra;
  if(st.scope&&st.scope.area!=null)return new Set([st.scope.area]);return null}
document.getElementById('up').onclick=ascend;
document.getElementById('back').onclick=()=>{const s=st.hist.pop();if(!s)return;
  st.capa=s.capa;st.scope=s.scope;st.sel=s.sel;render(false)};
document.getElementById('hilo').onclick=()=>{if(!st.sel&&!st.hilo){toast('Selecciona un nodo primero — el hilo es SU cadena vertical.');return}
  st.hilo=!st.hilo;render(false)};
document.getElementById('who').onchange=e=>{st.lente=e.target.value;render(false);
  if(st.lente!=='')toast('Fog of war: mismo terreno, tu porción iluminada — lo ajeno es silueta, no vacío.')};
function viajar(c){if(c===st.capa)return;push();
  const dir=CAPAS.indexOf(c)>CAPAS.indexOf(st.capa)?'descend':'ascend';
  st.capa=c;
  if(st.sel&&st.hilo){const hs=new Set([st.sel,...ancestors(st.sel),...descendants(st.sel)]);
    const tgt=nodes.filter(n=>n.capa===c&&hs.has(n.id));
    st.scope=c==='O'&&tgt.length?{area:tgt[0].area}:null;
  } else st.scope=c==='O'?{area:0}:null;
  render(dir)}
stage.onclick=()=>{if(st.sel){st.sel=null;render(false)}document.getElementById('padres').style.display='none'};
let drag=null;
stage.addEventListener('mousedown',e=>{if(e.target.closest('.nd,#padres,.areafold'))return;drag={x:e.clientX,y:e.clientY,ox:view.x,oy:view.y};stage.classList.add('drag')});
window.addEventListener('mousemove',e=>{if(!drag)return;view.x=drag.ox+e.clientX-drag.x;view.y=drag.oy+e.clientY-drag.y;applyV()});
window.addEventListener('mouseup',()=>{drag=null;stage.classList.remove('drag')});
stage.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.1:0.9;const nz=Math.max(.3,Math.min(2,view.z*f));
  const r=stage.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  view.x=mx-(mx-view.x)*(nz/view.z);view.y=my-(my-view.y)*(nz/view.z);view.z=nz;applyV()},{passive:false});
let tT=null;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tT);tT=setTimeout(()=>t.style.opacity=0,3000)}
render(false);
</script>
</body></html>
