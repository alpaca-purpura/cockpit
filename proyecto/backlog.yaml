# backlog.yaml — System Backlog de Cockpit como dato (CK-11)
#
# QUÉ ES: SSoT del trabajo pendiente del sistema, organizado por subsistema ("columna").
# Mismo patrón que sistema/arquitectura/arquitectura.yaml (as-code, curado a mano): se edita
# en el MISMO evento que la decisión que lo cambia. La vista humana es BACKLOG.md — se
# actualiza en el mismo evento, jamás divergen.
#
# DISCIPLINA ("nacemos ordenados", CK-11):
# - Este archivo es la ÚNICA fuente de la verdad del pendiente. Los "Siguiente:" de fichas del
#   LEDGER y el §TBD de VISION son narrativa/contexto — apuntan a ítems BL-NN, no los duplican.
# - Idea/necesidad nueva → entra aquí PRIMERO (estado: pendiente). Se construye después.
# - Tomar trabajo → estado: en-curso. Terminado Y verificado → estado: hecho; si es capability
#   funcional, entrada CAP-NN en docs/increment.yaml (+ vista INCREMENT.md) en el mismo evento.
# - Decisión de alcance/arquitectura/visión → ficha CK-NN en LEDGER.md; el ítem la referencia.
# - La PRIORIDAD la firma el operador. Las de abajo son propuesta inicial (auditoría CK-11).

meta:
  id: cockpit-backlog
  nombre: "System Backlog — Cockpit"
  version: 0.1.0
  creado: CK-11
  proposito: >-
    Un solo lugar para saber qué falta del SISTEMA (transversal) y qué falta de cada
    subsistema/aplicación. Reemplaza el backlog fragmentado que la auditoría CK-11 encontró
    repartido entre VISION §TBD, arquitectura.yaml (estado: pendiente), LEDGER "Siguiente:" y
    campañas de research.

# ---- SUBSISTEMAS = las columnas ----
subsistemas:
  - id: sistema
    nombre: "Sistema (transversal)"
    sub: "lo que define el sistema, no una app: arquitectura, schemas, método, design system, disciplina"
  - id: vista-negocio
    nombre: "Vista Negocio (N13)"
    sub: "binario `directorio` + UI embebida — construida, en evolución"
  - id: motor-discovery
    nombre: "Motor de Discovery (N1 ★IP)"
    sub: "ingesta multi-fuente, As-Is→To-Be→gaps, razonamiento server-side — sin construir"
  - id: app-auditor
    nombre: "App del Auditor (Consultor)"
    sub: "aplicación instalable propia del consultor (patrón harness-studio/dev-studio); opera el método y publica procesos al repo del cliente — declarada CK-11, sin construir"
  - id: contrato-datos
    nombre: "Contrato de datos DevHub→Cockpit"
    sub: "Pull API diseñada (CK-08), sin código — gatillo: primer consumidor real"

# ---- ITEMS ----
items:

  # — sistema (transversal) —
  - id: BL-01
    subsistema: sistema
    titulo: "Persona/puesto como entidad de primera clase"
    detalle: >-
      negocio.schema modela objetivo/área/proceso/brecha; "puesto" es texto libre dentro de
      proceso. Modelar el pilar Personas de verdad. El hueco más grande declarado.
    origen: "VISION §TBD · CK-10 'Siguiente'"
    prioridad: alta
    estado: hecho
    fichas: [CK-10, CK-12]

  - id: BL-02
    subsistema: sistema
    titulo: "Reconciliar objeto.schema (9 entidades) ↔ negocio.schema implementado (4)"
    detalle: >-
      sistema/schema/objeto.schema.yaml se declara SSoT (9 entidades: empresa/persona/rol/área/
      proceso/sistema/objetivo/capability/brecha) pero el código solo implementa 4. Decidir cuál
      es el contrato vigente y el camino de convergencia. Conecta con BL-01.
      CERRADO: contrato vigente = objeto.schema (CK-12); /api/objeto lee y valida las 9 entidades
      JUNTAS (CK-13, CAP-08). El tramo restante (negocio.yaml → proyección generada) = BL-19.
    origen: "auditoría CK-11"
    prioridad: alta
    estado: hecho
    fichas: [CK-12, CK-13]

  - id: BL-03
    subsistema: sistema
    titulo: "Terminar arquitectura / diagrama de despliegue"
    detalle: >-
      NODOS.md (13 nodos, BYOC) heredado incompleto — el operador lo declara "falta terminar".
      Incluye incorporar la App del Auditor al mapa de despliegue.
      CERRADO (CK-14): N14 App del Auditor fichada e incorporada (R16/R17, etapa E3); estados
      post-Stage-4 corregidos (contrato CK-08 diseñado, N13 = binario directorio + /api/objeto);
      despliegue.html portado estático y actualizado; ARCHITECTURE/README al día. La deuda
      Go/Next del lado Cockpit se consolidó como BL-20.
    origen: "operador, sesión CK-11"
    prioridad: alta
    estado: hecho
    fichas: [CK-11, CK-14]

  - id: BL-04
    subsistema: sistema
    titulo: "Design system + atomic design + Storybook as-code"
    detalle: >-
      No existe aún en el repo. Toda capability nueva de UI debe construirse contra él
      (doctrina CK-11). Definirlo antes de la próxima vista nueva.
    origen: "operador, sesión CK-11"
    prioridad: media
    estado: pendiente
    fichas: [CK-11]

  - id: BL-05
    subsistema: sistema
    titulo: "Poblar el método: M1 beats 2-3 · M3 etapas 1-5"
    detalle: >-
      sistema/metodo/proceso/ tiene poblados M1 Beat 1 (6 pasos) y M3 Etapa 0. El resto son
      esqueletos (_etapa.md sin pasos).
    origen: "sistema/metodo/proceso/README.md"
    prioridad: media
    estado: pendiente
    fichas: []

  - id: BL-06
    subsistema: sistema
    titulo: "negocio.schema vive en el plugin del harness, no en el repo"
    detalle: >-
      go/negocio.go valida contra una reimplementación (validateNegocio); el schema YAML lo
      aporta el plugin. Decidir SSoT: ¿traer el schema al repo (sistema/schema/) o dejarlo en
      el kit?
    origen: "auditoría CK-11"
    prioridad: media
    estado: pendiente
    fichas: []

  - id: BL-07
    subsistema: sistema
    titulo: "Destilar research: separar salidas de sistema vs narrativa de campaña"
    detalle: >-
      proyecto/research/ mezcla material de organización con artefactos cristalizados de
      sistema. objeto.schema ya se promovió (CK-11); revisar el resto sobre la marcha.
    origen: "operador: 'vamos destilando en el camino'"
    prioridad: media
    estado: en-curso
    fichas: [CK-11]

  - id: BL-08
    subsistema: sistema
    titulo: "Decidir render de arquitectura.yaml (generador no portado)"
    detalle: >-
      gen_arquitectura_cockpit.py quedó en el monorepo; el YAML es documentación curada a mano.
      ¿Vale un render propio?
    origen: "deuda CK-10"
    prioridad: baja
    estado: pendiente
    fichas: [CK-10]

  - id: BL-09
    subsistema: sistema
    titulo: "Borrar carpetas ~/Proyectos/campaign-* originales"
    detalle: >-
      Contenido ya rescatado en proyecto/research/. Borrado pendiente — decisión del operador.
    origen: "deuda CK-10"
    prioridad: baja
    estado: pendiente
    fichas: [CK-10]

  - id: BL-10
    subsistema: sistema
    titulo: "Comprador con nombre y cara · pricing · éxito a 12 meses"
    detalle: >-
      TBD heredado de CK-01, sin gate bloqueante (I-71 lo derogó). Contexto útil para priorizar
      este backlog.
    origen: "VISION §TBD"
    prioridad: baja
    estado: pendiente
    fichas: []

  - id: BL-19
    subsistema: sistema
    titulo: "Voltear negocio.yaml a proyección GENERADA del objeto"
    detalle: >-
      El último tramo de la convergencia D-13: negocio.yaml deja de curarse a mano y se deriva
      del objeto (mecanismo por decidir, D-04: archivo generado vs join-en-vivo en el cockpit).
      Gatillo: objeto poblado con objetivos y brechas (hoy prenter tiene 0 y 0 — el AS-IS de
      procesos/roles/sistemas ya está).
    origen: "CK-13 (deuda declarada) · D-13"
    prioridad: media
    estado: pendiente
    fichas: [CK-13]

  # — vista-negocio (N13) —
  - id: BL-11
    subsistema: vista-negocio
    titulo: "Rol Área real (hoy placeholder 'próximamente')"
    detalle: "Su rebanada de procesos/sistemas. Declarado desde CK-01, placeholder en CockpitShell."
    origen: "arquitectura.yaml (rol-area: declarado)"
    prioridad: media
    estado: pendiente
    fichas: [CK-01, CK-06]

  - id: BL-12
    subsistema: vista-negocio
    titulo: "Auth / roles reales"
    detalle: "No hay auth. Gate para cualquier despliegue multi-usuario en cliente."
    origen: "auditoría CK-11"
    prioridad: media
    estado: pendiente
    fichas: []

  - id: BL-20
    subsistema: vista-negocio
    titulo: "Resolver deuda Go/Next de N13 — migrar UI a Vite SPA"
    detalle: >-
      Matar el doble backend heredado: Next.js static-export → SPA Vite + React Router embebida
      con go:embed, Go como único backend (playbook documentado en NODOS.md N5, mismo linaje).
      Vivía solo como narrativa en NODOS "Pendientes consolidados"; consolidada al backlog en
      CK-14 (disciplina CK-11). Decidir antes de construir vistas nuevas; conecta con BL-04
      (design system — misma ventana de re-estilizado).
    origen: "NODOS.md N13/N5 (deuda heredada) · consolidada en CK-14"
    prioridad: media
    estado: pendiente
    fichas: [CK-14]

  # — motor-discovery (N1) —
  - id: BL-13
    subsistema: motor-discovery
    titulo: "Campaña N1: diseño → construcción del Motor de Discovery"
    detalle: >-
      La mitad ★IP sin construir: ingesta multi-fuente, As-Is→To-Be→gaps sobre los 4 pilares.
      Diseño heredado en sistema/arquitectura/NODOS.md#n1. Decidir arranque de campaña.
    origen: "VISION §TBD · CK-10 'Siguiente'"
    prioridad: tbd
    estado: pendiente
    fichas: [CK-10]

  - id: BL-14
    subsistema: motor-discovery
    titulo: "Capability 'preparación para auditoría' (gap-check vs cláusulas ISO)"
    detalle: >-
      Declarada CK-10, se activa solo con demanda real de un cliente. Nunca emite certificados
      (límite I-05).
    origen: "VISION §ISO (CK-10)"
    prioridad: tbd
    estado: pendiente
    fichas: [CK-10]

  # — app-auditor —
  - id: BL-15
    subsistema: app-auditor
    titulo: "Definir el producto App del Auditor"
    detalle: >-
      Aplicación instalable propia del consultor (patrón harness-studio/dev-studio): alcance,
      stack, cómo embebe el método (sistema/metodo/). Primera ficha de diseño del subsistema.
    origen: "operador, sesión CK-11"
    prioridad: alta
    estado: pendiente
    fichas: [CK-11]

  - id: BL-16
    subsistema: app-auditor
    titulo: "Embeber el método como flujo operable (m1 levantamiento · m2 mantenimiento · m3 espinazo)"
    detalle: >-
      El proceso-como-dato de sistema/metodo/proceso/ ejecutable desde la app: carriles
      consultor/cliente/sistema, provenance, AS-IS sellado.
    origen: "operador, sesión CK-11"
    prioridad: alta
    estado: pendiente
    depende: [BL-15]
    fichas: [CK-11]

  - id: BL-17
    subsistema: app-auditor
    titulo: "Publicación al repo del cliente — 'deploy de procesos'"
    detalle: >-
      El resultado del trabajo del consultor se conecta al repositorio propio de la empresa
      cliente para actualizar el sistema — como un programador que carga código a producción,
      pero el artefacto son procesos/roles/objetivos que Cockpit entiende y renderiza.
    origen: "operador, sesión CK-11"
    prioridad: alta
    estado: pendiente
    depende: [BL-15]
    fichas: [CK-11]

  # — contrato-datos —
  - id: BL-18
    subsistema: contrato-datos
    titulo: "Implementar Pull API DevHub→Cockpit"
    detalle: >-
      GET /api/contrato/directorio?sistema=... con envelope {contract_version, data} + cliente
